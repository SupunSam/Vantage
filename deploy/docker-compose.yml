# Vantage local build: SQL Server, the API, the Admin Portal, the User Portal and a mail catcher.
# Start:  docker compose -f deploy/docker-compose.yml up -d --build
# Open:   http://localhost:8080 (Admin)  http://localhost:8081 (User)  http://localhost:8025 (emails)
# GenAI dashboards load from http://localhost:8082 (inside a frame in the portals; nothing to open by hand).
# Secrets live in deploy/.env (not in git); deploy/.env.example shows the format.
name: vantage

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vantage-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in deploy/.env}
    ports:
      - "1433:1433"          # for SSMS / Azure Data Studio
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # Runs once: creates the Vantage database, the vantage_app login and the dummy HRMS table, then exits.
  # (An older install's database and login are renamed in place; see deploy/db/init.sql.)
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in deploy/.env}
    volumes:
      - ./db:/init:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -v APP_PASSWORD="$$APP_DB_PASSWORD" -i /init/init.sql
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    container_name: vantage-api
    depends_on:
      db-init:
        condition: service_completed_successfully
      mail:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development      # local build: dev sign-in picker instead of ADFS/Cognito
      ConnectionStrings__Default: "Server=db,1433;Database=Vantage;User Id=vantage_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      DataProtection__KeysPath: /data/keys     # encrypts the secrets entered in the Tenant Master
      Storage__LocalPath: /data/files          # uploaded .pbix files and thumbnails
      Bootstrap__SuperAdminEmail: ${SUPER_ADMIN_EMAIL:-nimal.perera@rrd.com}
      # Emails go to the Mailpit container below (open http://localhost:8025 to read them); SES in AWS.
      Email__SmtpHost: mail
      Email__SmtpPort: "1025"
      Email__FromAddress: vantage@rrd.com
      Email__UserPortalUrl: http://localhost:8081
      Email__AdminPortalUrl: http://localhost:8080
      # GenAI dashboards are served from their own origin (the genai service below), framed only by the two portals.
      # These two are this environment's defaults; Admin Configuration > GenAI Config can override them without a restart.
      # (The malware scanner, link lifetime and warning size are set in Admin Configuration > GenAI Config.)
      GenAi__BaseUrl: http://localhost:8082
      GenAi__FrameAncestors: "http://localhost:8080 http://localhost:8081"
    volumes:
      - appdata:/data
    restart: unless-stopped

  admin:
    build:
      context: ..
      dockerfile: deploy/admin.Dockerfile
    container_name: vantage-admin
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

  user:
    build:
      context: ..
      dockerfile: deploy/user.Dockerfile
    container_name: vantage-user
    depends_on:
      - api
    ports:
      - "8081:80"
    restart: unless-stopped

  # GenAI dashboards: a separate origin (http://localhost:8082) so a dashboard's script can't touch the portals.
  genai:
    image: nginx:1.27-alpine
    container_name: vantage-genai
    depends_on:
      - api
    ports:
      - "8082:80"
    volumes:
      - ./genai.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # Optional malware scanner for GenAI uploads (ClamAV). Only starts with:  docker compose --profile scan up -d
  # The first start downloads virus signatures and takes a few minutes. Then set the scanner host to "clamav" in
  # Admin Configuration > GenAI Config. Once a host is set, uploads are refused until the scanner is ready.
  clamav:
    image: clamav/clamav:stable
    container_name: vantage-clamav
    profiles: ["scan"]
    restart: unless-stopped

  # Local mail catcher: every email Vantage sends shows up at http://localhost:8025 (nothing leaves your machine).
  mail:
    image: axllent/mailpit:latest
    container_name: vantage-mail
    ports:
      - "8025:8025"
    restart: unless-stopped

# Named volumes, created as vantage_sqldata and vantage_appdata (the project name is vantage):
# the database, uploaded files and encryption keys.
volumes:
  sqldata:
  appdata:
