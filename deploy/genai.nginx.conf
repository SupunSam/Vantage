# GenAI origin (http://localhost:8082 locally, the GenAI domain in AWS).
# It serves nothing but signed dashboard links: /<token> is passed to the API's /genai/<token>. It is a different
# origin from both portals, so a dashboard's script can't reach the portal's session or API.
server {
    listen 80;
    server_name _;

    # Only reading is allowed.
    location / {
        limit_except GET { deny all; }
        proxy_pass http://api:8080/genai/;
        proxy_set_header Host $host;
        proxy_hide_header Set-Cookie;
        # The API sets the Content-Security-Policy, sandbox and no-store headers; they pass through untouched.
    }
}
